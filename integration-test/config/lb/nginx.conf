# Load balancer for the integration test cluster: the parking drainer hands drained jobs off through this endpoint
# ([broker] retrigger-base-endpoint), so hand-offs are spread across ibroker and ibroker2.
events {
    worker_connections 1024;
}

http {
    upstream brokers {
        server ibroker:8080;
        server ibroker2:8083;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://brokers;
            proxy_set_header Host $host;
        }
    }
}
