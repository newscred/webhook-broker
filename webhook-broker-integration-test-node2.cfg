[rdbms]
dialect=mysql
connection-url=webhook_broker:zxc909zxc@tcp(mysql:3306)/webhook-broker?charset=utf8mb4&collation=utf8mb4_0900_ai_ci&parseTime=true&multiStatements=true

[http]
listener=:8083

[broker]
max-message-queue-size=10000000
max-workers=250
retry-backoff-delays-in-seconds=1
rational-delay-in-seconds=1
# Recovery workers stay on the original two nodes so the existing retry-count assertions keep their environment
recovery-workers-enabled=false
retrigger-base-endpoint=http://ibroker-lb

[consumer-connection]
connection-timeout-in-seconds=10

[log]
log-level=error

[dlq]
summary-update-interval-seconds=5


[dispatch-pause]
admin-token=integration-test-admin-token
registry-refresh-interval-seconds=1
drain-interval-seconds=1
handoff-mode=http
handoff-lease-seconds=5
