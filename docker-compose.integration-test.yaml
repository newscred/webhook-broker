services:
  mysql8:
    image: mysql:${MYSQL_VERSION:-8.0.37}
    container_name: mysql8
    # Three broker nodes (up to 100 connections each) plus the pruner exceed MySQL's default of 151
    command: ["--max-connections=500"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webhook-broker
      MYSQL_USER: webhook_broker
      MYSQL_PASSWORD: zxc909zxc
    ports:
      - "45060:3306"
    healthcheck:
      test: ["CMD", "mysql","-h", "localhost", "-u", "root", "-proot", "-e", "SELECT 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 20s
    networks:
      brokeritest:
        aliases:
          - "mysql8"
          - "mysql"


  ibroker:
    build: .
    container_name: ibroker
    volumes:
      - ./webhook-broker-integration-test.cfg:/webhook-broker.cfg
    command: ["./webhook-broker", "-migrate", "./migration/sqls/"]
    depends_on:
      mysql8:
        condition: service_healthy
    ports:
      - "31818:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_status"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      brokeritest:
        aliases:
          - "webhook-broker"
  
  ibroker-hmac:
    build: .
    container_name: ibroker-hmac
    volumes:
      - ./webhook-broker-integration-test-hmac.cfg:/webhook-broker.cfg
    command: ["./webhook-broker", "-migrate", "./migration/sqls/"]
    depends_on:
      ibroker:
        condition: service_healthy
    ports:
      - "31820:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/_status"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      brokeritest:
        aliases:
          - "webhook-broker-hmac"

  ibroker2:
    build: .
    container_name: ibroker2
    volumes:
      - ./webhook-broker-integration-test-node2.cfg:/webhook-broker.cfg
    command: ["./webhook-broker", "-migrate", "./migration/sqls/"]
    depends_on:
      ibroker:
        condition: service_healthy
    ports:
      - "31821:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/_status"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      brokeritest:
        aliases:
          - "webhook-broker-2"

  ibroker-lb:
    image: nginx:alpine
    container_name: ibroker-lb
    volumes:
      - ./integration-test/config/lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ibroker:
        condition: service_healthy
      ibroker2:
        condition: service_healthy
    networks:
      brokeritest:
        aliases:
          - "ibroker-lb"

  ipruner:
    build:
      context: .
      dockerfile: ./integration-test/prune-integration-test.Dockerfile
    container_name: ipruner
    volumes:
      - ./webhook-broker-integration-test.cfg:/webhook-broker.cfg
      - ./integration-test/config/prune/nginx.conf:/etc/nginx/nginx.conf
      - ./integration-test/config/prune/file_browser_nginx.conf:/etc/nginx/http.d/file_browser.conf
      - ./integration-test/config/prune/runner.sh:/runner.sh
    depends_on:
      ibroker:
        condition: service_healthy
    ports:
      - "30080:80"
    networks:
      brokeritest:
        aliases:
          - "webhook-broker-pruner"

  tester:
    build: integration-test/.
    container_name: tester
    command: ["make", "run"]
    depends_on:
      ibroker:
        condition: service_healthy
      ibroker-hmac:
        condition: service_healthy
      ibroker2:
        condition: service_healthy
      ibroker-lb:
        condition: service_started
      ipruner:
        condition: service_started
    networks:
      brokeritest:
        aliases:
          - "tester"

networks:
  brokeritest:
