openapi: 3.0.0
info:
  title: Webhook Broker API
  description: This is a fully HTTP-based Pub/Sub Broker designed to simplify system architecture in SOA or Microservice architecture.
  version: 1.0.0
paths:
  /producers:
    get:
      summary: Get list of producers
      tags:
        - Producers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        '400':
          description: Bad request
  /producer/{producerId}:
    get:
      summary: Get a specific producer
      tags:
        - Producers
      parameters:
        - name: producerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MsgStakeholder'
        '404':
          description: Producer not found
    put:
      summary: Update a specific producer
      tags:
        - Producers
      parameters:
        - name: producerId
          in: path
          required: true
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
          description: Only update if the resource has not been modified since this timestamp
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MsgStakeholder'
        '400':
          description: Bad request
        '404':
          description: Producer not found
        '412':
          description: Precondition failed - resource has been modified
  /channels:
    get:
      summary: Get list of channels
      tags:
        - Channels
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        '400':
          description: Bad request
  /channel/{channelId}:
    get:
      summary: Get a specific channel
      tags:
        - Channels
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelModel'
        '404':
          description: Channel not found
    put:
      summary: Update a specific channel
      tags:
        - Channels
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
          description: Only update if the resource has not been modified since this timestamp
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelModel'
        '400':
          description: Bad request
        '404':
          description: Channel not found
        '412':
          description: Precondition failed - resource has been modified
  /channel/{channelId}/consumers:
    get:
      summary: Get list of consumers for a channel
      tags:
        - Consumers
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        '400':
          description: Bad request
  /channel/{channelId}/consumer/{consumerId}:
    get:
      summary: Get a specific consumer
      tags:
        - Consumers
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerModel'
        '404':
          description: Consumer not found
    put:
      summary: Update a specific consumer
      tags:
        - Consumers
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
          description: Only update if the resource has not been modified since this timestamp
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                name:
                  type: string
                callbackUrl:
                  type: string
                type:
                  type: string
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerModel'
        '400':
          description: Bad request
        '404':
          description: Consumer not found
        '412':
          description: Precondition failed - resource has been modified
    delete:
      summary: Delete a specific consumer
      tags:
        - Consumers
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
          description: Only delete if the resource has not been modified since this timestamp
      responses:
        '204':
          description: Successful deletion
        '404':
          description: Consumer not found
        '412':
          description: Precondition failed - resource has been modified
  /_status:
    get:
      summary: Get application status
      tags:
        - Status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppData'
        '500':
          description: Internal server error
  /job-status:
    get:
      summary: Get job status counts grouped by consumer
      tags:
        - Status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '500':
          description: Internal server error
  /channel/{channelId}/consumer/{consumerId}/queued-jobs:
    get:
      summary: Get queued jobs for a consumer
      tags:
        - Jobs
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
          description: Channel authentication token
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
          description: Consumer authentication token
      responses:
        '200':
          description: Successful response. While the consumer (or the whole broker) is paused the list is empty and the X-Broker-Dispatch-Paused header is set.
          headers:
            X-Broker-Dispatch-Paused:
              description: Present with value "true" while dispatching to this consumer is paused
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResult'
        '400':
          description: Bad request
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - token does not match
        '412':
          description: Precondition failed
  /channel/{channelId}/consumer/{consumerId}/job/{jobId}/requeue-dead-job:
    post:
      summary: Requeue a dead job for a consumer
      tags:
        - Jobs
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
          description: Channel authentication token
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
          description: Consumer authentication token
      responses:
        '202':
          description: Job requeued successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - token does not match
        '404':
          description: Job not found
        '412':
          description: Precondition failed
  /channel/{channelId}/consumer/{consumerId}/job/{jobId}:
    get:
      summary: Get a specific job
      tags:
        - Jobs
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
          description: Channel authentication token
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
          description: Consumer authentication token
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HyperlinkedDeliveryJobModel'
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - token does not match
        '404':
          description: Job not found
        '412':
          description: Precondition failed
    post:
      summary: Update a specific job
      tags:
        - Jobs
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
          description: Channel authentication token
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
          description: Consumer authentication token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NextState:
                  type: string
                IncrementalTimeout:
                  type: integer
      responses:
        '202':
          description: Job updated successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - token does not match
        '404':
          description: Job not found
        '409':
          description: Dispatch paused - the job is PARKED, or a QUEUED/DEAD to INFLIGHT transition was refused because the consumer is paused. INFLIGHT to DELIVERED/DEAD is still allowed.
        '412':
          description: Precondition failed
    delete:
      summary: Delete a single dead job
      tags:
        - DLQ
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Dead job deleted successfully
        '403':
          description: Token mismatch
        '404':
          description: Job not found, not dead, or retry not exhausted
  /channel/{channelId}/broadcast:
    post:
      summary: Broadcast a message to a channel
      tags:
        - Broadcast
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
          description: Channel authentication token
        - name: X-Broker-Producer-ID
          in: header
          required: true
          schema:
            type: string
          description: Producer identifier
        - name: X-Broker-Producer-Token
          in: header
          required: true
          schema:
            type: string
          description: Producer authentication token
        - name: X-Broker-Message-ID
          in: header
          required: false
          schema:
            type: string
          description: Optional custom message ID for idempotent broadcasting
        - name: X-Broker-Message-Priority
          in: header
          required: false
          schema:
            type: integer
          description: Message priority (higher value = higher priority)
        - name: X-Broker-Scheduled-For
          in: header
          required: false
          schema:
            type: string
          description: RFC3339 timestamp for scheduled message delivery
        - name: X-Broker-Metadata-Headers
          in: header
          required: false
          schema:
            type: string
          description: Comma-separated list of header names to include as message metadata
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
      responses:
        '201':
          description: Message broadcasted successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized - missing or invalid token
        '403':
          description: Forbidden - token does not match
        '409':
          description: Conflict - Duplicate message ID
        '412':
          description: Precondition failed
  /channel/{channelId}/message/{messageId}:
    get:
      summary: Get a specific message
      tags:
        - Messages
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageModel'
        '404':
          description: Message not found
  /channel/{channelId}/messages:
    get:
      summary: Get list of messages for a channel
      tags:
        - Messages
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        '400':
          description: Bad request
  /channel/{channelId}/messages-status:
    get:
      summary: Get message status counts for a channel
      tags:
        - Messages
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusCount'
        '500':
          description: Internal server error
  /channel/{channelId}/scheduled-messages:
    get:
      summary: Get list of scheduled messages for a channel
      tags:
        - Scheduled Messages
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: integer
          description: Filter by scheduled message status
        - name: previous
          in: query
          required: false
          schema:
            type: string
          description: Pagination cursor for previous page
        - name: next
          in: query
          required: false
          schema:
            type: string
          description: Pagination cursor for next page
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResult'
        '404':
          description: Channel not found
  /channel/{channelId}/scheduled-message/{messageId}:
    get:
      summary: Get a specific scheduled message
      tags:
        - Scheduled Messages
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledMessageModel'
        '404':
          description: Scheduled message not found
  /channel/{channelId}/consumer/{consumerId}/dlq:
    get:
      summary: Get dead letter queue for a consumer
      tags:
        - DLQ
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DLQList'
        '404':
          description: Consumer not found
    delete:
      summary: Purge all dead jobs for a consumer
      tags:
        - DLQ
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dead jobs deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
                    format: int64
        '403':
          description: Token mismatch
        '404':
          description: Channel or consumer not found
    post:
      summary: Requeue dead jobs for a consumer
      tags:
        - DLQ
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                requeue:
                  type: string
      responses:
        '202':
          description: Dead jobs requeued successfully
        '400':
          description: Bad request
        '404':
          description: Consumer not found
  /dlq-status:
    get:
      summary: Get DLQ status summary across all consumers
      tags:
        - DLQ
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DLQStatus'
  /channel/{channelId}/consumer/{consumerId}/dispatch-pause:
    put:
      summary: Pause dispatching to a consumer
      description: Broadcasts are still accepted; jobs for this consumer are parked until it is resumed. Idempotent - pausing an already paused consumer returns the existing pause.
      tags:
        - Dispatch Pause
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1024
      responses:
        '200':
          description: Consumer paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchPause'
        '400':
          description: Reason too long
        '403':
          description: Token mismatch
        '404':
          description: Channel or consumer not found
    get:
      summary: Get the consumer's dispatch pause
      tags:
        - Dispatch Pause
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The consumer is paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchPause'
        '403':
          description: Token mismatch
        '404':
          description: Channel or consumer not found, or the consumer is not paused
    delete:
      summary: Resume dispatching to a consumer
      description: The drainer moves the consumer's parked jobs back into the job queue on its next run (unless a global pause is active).
      tags:
        - Dispatch Pause
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: consumerId
          in: path
          required: true
          schema:
            type: string
        - name: X-Broker-Channel-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Broker-Consumer-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Consumer resumed
        '403':
          description: Token mismatch
        '404':
          description: Channel or consumer not found, or the consumer was not paused
  /dispatch-pause:
    put:
      summary: Pause dispatching to every consumer
      description: Disabled (404) unless [dispatch-pause] admin-token is configured. Idempotent.
      tags:
        - Dispatch Pause
      security:
        - AdminToken: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1024
      responses:
        '200':
          description: Broker paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchPause'
        '400':
          description: Reason too long
        '401':
          description: Admin token missing or not matching
        '404':
          description: Admin token not configured
    delete:
      summary: Resume dispatching globally
      description: Consumers with their own pause stay paused.
      tags:
        - Dispatch Pause
      security:
        - AdminToken: []
      responses:
        '204':
          description: Broker resumed
        '401':
          description: Admin token missing or not matching
        '404':
          description: Admin token not configured, or the broker was not paused
  /dispatch-pauses:
    get:
      summary: List all dispatch pauses and parked job counts
      description: Requires the admin token when one is configured; open otherwise. Parked entries include consumers that were resumed but are still draining.
      tags:
        - Dispatch Pause
      security:
        - AdminToken: []
        - {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchPauses'
        '401':
          description: Admin token configured but missing or not matching
  /_internal/jobs/enqueue:
    post:
      summary: (Internal) Enqueue handed-off jobs on this node
      description: Called by the parking drainer through the load-balanced [broker] retrigger-base-endpoint. Not for public use. Disabled (404) unless [dispatch-pause] admin-token is configured; subject to gateway HMAC auth when enabled.
      tags:
        - Internal
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueRequest'
      responses:
        '202':
          description: Jobs enqueued; accepted excludes ids that were no longer QUEUED or whose consumer was paused again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueResponse'
        '400':
          description: Malformed body or more ids than drain-page-size
        '401':
          description: Admin token missing or not matching
        '404':
          description: Admin token not configured
        '503':
          description: Node queue above the hand-off high-water mark; retry (the load balancer picks another node)
          headers:
            Retry-After:
              schema:
                type: integer
components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Broker-Admin-Token
  schemas:
    MsgStakeholder:
      type: object
      properties:
        ID:
          type: string
        Name:
          type: string
        Token:
          type: string
        ChangedAt:
          type: string
          format: date-time
    ListResult:
      type: object
      properties:
        Result:
          type: array
          items:
            type: string
            format: uri
        Pages:
          type: object
          additionalProperties:
            type: string
    ChannelModel:
      type: object
      properties:
        MsgStakeholder:
          $ref: '#/components/schemas/MsgStakeholder'
        ConsumersURL:
